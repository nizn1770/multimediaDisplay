# Copy to config.local.yaml (gitignored) and fill in real values there. NEVER commit IDs/keys.
mock: true                      # true = fixtures, no Google accounts needed
timezone: America/Chicago
device:
  user: pi
  hostname: pitv
drive:
  folder_id: "YOUR_DRIVE_FOLDER_ID"
  sync_interval_sec: 300
  cache_dir: ./cache/photos
  max_cache_mb: 500              # oldest photos dropped beyond this
calendar:
  # One or more calendars; color is used in the UI.
  calendars:
    - id: "YOUR_CALENDAR_ID"
      name: Family
      color: "#4a90e2"
  refresh_interval_sec: 600
credentials:
  type: service_account          # or "oauth"
  service_account_file: /home/pi/pi-tv-display/secrets/service-account.json
  oauth_client_file: ./secrets/oauth-client.json
  oauth_token_file: ./secrets/token.json
slideshow:
  seconds_per_photo: 15
  max_width: 1920                # photos are downscaled + EXIF-rotated at sync time (use 1280x720 on a 720p TV)
  max_height: 1080
  jpeg_quality: 85
weather:
  enabled: true
  location_name: Minneapolis, MN
  latitude: 44.9778
  longitude: -93.2650
  units: fahrenheit
  forecast_days: 3
night:                           # screen hours (America/Chicago); editable at /settings or ./pitv set-hours
  enabled: true
  off_at: "23:00"
  on_at: "06:30"
  control_display: true          # app runs scripts/screen.sh on/off at these times (HDMI/CEC)
  screen_command: ./scripts/screen.sh
settings:
  pin: ""                        # optional PIN for /settings (set it in config.local.yaml)
server:
  host: 0.0.0.0                 # LAN-reachable; /settings is restricted to private IPs
  port: 8080
